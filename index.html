<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5efdf"><title>天ぷら、音ごろ。</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4efdf;color:#312e24;font:16px/1.65 system-ui,sans-serif}main{max-width:940px;margin:auto;padding:26px clamp(16px,5vw,60px) 40px}header,footer,.stats,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}header{border-bottom:3px double #514e40;padding-bottom:13px;font: bold 16px serif;letter-spacing:.12em}.brand{background:#a7432d;color:#fff4dc;padding:4px 8px;margin-right:9px}.clock{font:12px monospace}.hero{position:relative;min-height:315px;display:flex;align-items:center;border-bottom:1px solid #8d8674}.hero canvas{position:absolute;right:0;width:57%;height:100%}.title{position:relative;pointer-events:none}h1,h2{font-family:serif;margin:0;line-height:1.16}h1{font-size:clamp(50px,7vw,84px);letter-spacing:-.07em}h1 em{color:#a7432d;font-style:normal}h2{font-size:25px}p{margin:.65em 0}.menu{max-width:560px;margin:27px auto}.choice,.primary,.lift{width:100%;font:inherit;cursor:pointer;touch-action:manipulation}.choice{display:flex;align-items:center;gap:13px;text-align:left;background:transparent;border:1px solid #aaa18a;padding:10px 15px;margin:8px 0;color:inherit}.choice[aria-pressed=true]{border:2px solid #465840;background:#e7e9d8;padding:9px 14px}.choice:before{content:'○';color:#526548}.choice[aria-pressed=true]:before{content:'●'}.choice small{margin-left:auto}.primary{background:#a43e2b;border:0;color:#fff6df;padding:14px;margin-top:12px;font-weight:bold;letter-spacing:.1em}.primary:hover{background:#843320}footer{border-top:3px double #726d5e;margin-top:24px;padding-top:10px;font-size:12px;color:#5d584b}.stats{padding:15px 0;font-weight:bold}.playarea{position:relative;background:#eae3cd;border:1px solid #9e967f}.playarea canvas{display:block;width:100%;height:clamp(185px,37vh,355px)}.row{align-items:stretch;margin-top:10px}.lift{border:1px solid #4e5c48;background:#44533f;color:white;padding:12px 5px}.lift:disabled{background:#a09e8e}.feedback{min-height:2em;text-align:center;font:bold 22px serif;color:#913b28}.hint{text-align:center;font-size:14px}.result{padding:45px 0;text-align:center;max-width:480px;margin:auto}.rank{font: bold 54px serif;color:#a7432d}.result strong{font-size:36px}.eyebrow{font:12px monospace;letter-spacing:.18em;margin-bottom:15px}button:focus-visible{outline:3px solid #31569a;outline-offset:2px}[hidden]{display:none!important}@media(max-width:580px){main{padding-top:15px}.hero{min-height:235px}.hero canvas{width:59%;right:-9px}.title p{font-size:13px;max-width:12em}.choice small{font-size:11px}.menu{margin:20px auto}.stats{font-size:14px;gap:4px}}
</style><main><header><span><b class="brand">揚</b>天ぷら稽古場</span><span class="clock">一回 六十秒</span></header>
<section id="intro"><div class="hero"><canvas id="cover" aria-hidden="true"></canvas><div class="title"><div class="eyebrow">TEMPURA / OTOGORO</div><h1>天ぷら、<br><em>音ごろ。</em></h1><p>油の音で、揚げどきを。</p></div></div><div class="menu"><h2>音を出して遊んでください</h2><p>低い「じゅわっ」が、細く静かな「ちりちり」に変わったら引き上げどき。乾いた音がたまに鳴る頃には、もう揚げすぎです。</p><button class="choice" id="ear" aria-pressed="true"><b>耳で揚げる</b><small>油の音を頼りに</small></button><button class="choice" id="eye" aria-pressed="false"><b>見て揚げるモード</b><small>衣の色と文字が目安</small></button><button id="start" class="primary">稽古をはじめる　→</button></div></section>
<section id="play" hidden><div class="stats"><span id="timer"></span><span id="points"></span><span id="chain"></span></div><div class="playarea"><canvas id="pan" aria-label="油の鍋。タップして引き上げる"></canvas></div><div class="row" id="buttons"></div><p class="feedback" id="feedback" role="status"></p><p class="hint" id="hint"></p></section>
<section id="result" class="result" hidden><div class="eyebrow">稽 古 成 績</div><h2>本日の段位</h2><p class="rank" id="rank"></p><p>きれいに揚げた数　<strong id="count"></strong> 品</p><p id="summary"></p><p id="record"></p><button class="primary" id="again">もう一回遊ぶ　→</button><button class="choice" id="back">モードを選び直す</button></section><footer><span>えび ・ なす ・ かぼちゃ ・ ししとう</span><span>天ぷら稽古場</span></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const foods=[['エビ',5.2],['なす',6.1],['かぼちゃ',7.2],['ししとう',4.1]];
const SOUND={lowHz:230,readyHz:2800,startRate:33,readyRate:13,dryRate:2.2,earlyGain:.19,readyGain:.058,pan:.78};
const clamp=x=>Math.max(0,Math.min(1,x)),mix=(a,b,k)=>a+(b-a)*k;
let ctx,master,noise,visual=false,active=false,opening=false,slots=[],bag=[],startTime,score,good,streak,maxStreak,raf,interval,feedbackUntil;
function mode(v){visual=v;$('eye').setAttribute('aria-pressed',v);$('ear').setAttribute('aria-pressed',!v)}
$('ear').onclick=()=>mode(false);$('eye').onclick=()=>mode(true);
async function unlock(){
 if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createDynamicsCompressor();master.connect(ctx.destination);
 noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);let a=noise.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 await ctx.resume();
}
function pulse(t,hz,gain,duration,pos,tone=false){
 let src=tone?ctx.createOscillator():ctx.createBufferSource(),env=ctx.createGain(),filter=ctx.createBiquadFilter();
 if(tone){src.frequency.setValueAtTime(hz,t);src.frequency.exponentialRampToValueAtTime(hz*.82,t+duration)}else{src.buffer=noise;src.loop=true}
 filter.type='bandpass';filter.frequency.value=Math.min(ctx.sampleRate*.44,hz);filter.Q.value=tone?.8:1.3;
 src.connect(filter);filter.connect(env);let out=env;
 if(ctx.createStereoPanner){out=ctx.createStereoPanner();out.pan.value=pos;env.connect(out)}out.connect(master);
 env.gain.setValueAtTime(.00001,t);env.gain.exponentialRampToValueAtTime(gain,t+.003);env.gain.exponentialRampToValueAtTime(.00001,t+duration);
 if(tone)src.start(t);else src.start(t,Math.random()*.8);src.stop(t+duration+.004);src.onended=()=>{src.disconnect();filter.disconnect();env.disconnect();out.disconnect()}
}
function audioTick(){
 if(!active||!ctx||ctx.state!=='running')return;
 const now=performance.now();
 slots.forEach((s,i)=>{if(!s.food)return;let p=(now-s.born)/s.ms,k=clamp(p/.9),dry=p>1.13;
 let rate=dry?SOUND.dryRate:mix(SOUND.startRate,SOUND.readyRate,k),pos=slots.length===1?0:(i?1:-1)*SOUND.pan;
 s.next=Math.max(s.next,ctx.currentTime);while(s.next<ctx.currentTime+.085){
 let hz=dry?3800:mix(SOUND.lowHz,SOUND.readyHz,k*k);
 let gain=dry?.065:mix(SOUND.earlyGain,SOUND.readyGain,k);
 pulse(s.next,hz*(.8+Math.random()*.6),gain,dry?.019:mix(.16,.065,k),pos);
 if(!dry&&Math.random()<.8*(1-k)){pulse(s.next+.008,2400+Math.random()*2300,.11,.026,pos);pulse(s.next,150+Math.random()*160,.105,.085,pos,true)}
 s.next+=(.55+Math.random()*.9)/rate
 }})
}
function chime(){if(!ctx||ctx.state!=='running')return;[880,1109,1320].forEach((hz,i)=>pulse(ctx.currentTime+i*.065,hz,.12,.24,0,true))}
function stage(canvas){
 const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 if(canvas.width!==Math.round(r.width*d)||canvas.height!==Math.round(r.height*d)){canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d)}
 const c=canvas.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,r.width,r.height);return [c,r.width,r.height]
}
const ink='#3d392d';
function ellipse(c,x,y,rx,ry,fill,stroke){c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function shape(c,path,fill,stroke=ink){let p=new Path2D(path);c.fillStyle=fill;c.fill(p);c.strokeStyle=stroke;c.lineWidth=1.8;c.stroke(p)}
function pot(c){shape(c,'M-92 -13 Q-89 47 -48 57 Q0 70 48 57 Q89 47 92 -13 Z','#454a41');
 for(let i=-77;i<78;i+=5){c.beginPath();c.moveTo(i,18);c.lineTo(i*.86,42+12*(1-Math.abs(i)/80));c.strokeStyle='#626456';c.lineWidth=1;c.stroke()}
 for(let side of [-1,1]){ellipse(c,side*94,-6,17,9,'#454a41',ink);ellipse(c,side*97,-8,8,3,'#e8dfc8')}
 ellipse(c,0,-12,93,35,'#626357',ink);ellipse(c,0,-11,86,28,'#cdb573',ink);ellipse(c,0,-9,80,23,'#d9c690');
 for(let j=0;j<26;j++){let a=j*2.4,r=.4+(j%5)*.13;ellipse(c,Math.cos(a)*75*r,-10+Math.sin(a)*22*r,2+j%3,1,'#f2e3ae')}
}
const bodies=['M-34 -8 Q-9 -30 17 -15 Q37 -5 22 13 Q15 23 0 16 Q12 13 12 6 Q13 -1 1 0 Q-19 11 -33 6 Z','M-30 6 Q-28 -14 15 -13 Q34 -11 30 -2 Q12 18 -18 17 Q-28 16 -30 6Z','M-31 -12 Q0 7 30 -17 L32 -1 Q6 35 -31 8Z','M-34 5 Q-24 -1 -20 -6 Q-12 -15 0 -9 Q8 -5 18 -12 Q33 -15 29 -5 Q21 8 8 7 Q-12 5 -19 13Q-31 18 -34 5Z'];
function food(c,id,x,y,scale,p,bright){
 c.save();c.translate(x,y);c.scale(scale,scale);c.rotate(-.19);
 if(id===0)shape(c,'M-28 -6 L-48 -20 L-44 -7 L-51 -3 L-29 5Z','#c26343');
 if(id===3)shape(c,'M27 -9 Q37 -12 38 -20 L42 -19 Q39 -8 29 -4Z','#526742');
 let k=clamp(p),dark=clamp((p-1.1)*1.9),colors=bright?[[240,232,202],[231,173,56],[126,73,42]]:[[226,216,185],[210,184,123],[168,135,94]];
 let rgb=colors[0].map((v,i)=>mix(mix(v,colors[1][i],k),colors[2][i],dark));
 shape(c,bodies[id],'rgb('+rgb.join(',')+')');c.clip(new Path2D(bodies[id]));
 for(let j=0;j<94;j++){let a=((j*47)%83)-41,b=((j*31)%49)-25;ellipse(c,a,b,1+j%3,.8+j%2,j%3?'#f3deab':'#a58758')}
 if(id===2)shape(c,'M-33 3 Q0 33 34 -4 L33 5 Q0 36 -34 12Z','#626d42');if(id===1)shape(c,'M-32 8 Q-10 23 34 -6 L34 0 Q0 29 -33 17Z','#615264');
 c.restore()
}
function cover(){if($('intro').hidden)return;let [c,w,h]=stage($('cover'));c.translate(w*.47,h*.61);let z=Math.min(w/231,h/160);c.scale(z,z);ellipse(c,4,62,78,6,'#e0d8c1');pot(c);
 shape(c,'M-6 -40 L88 -94 L90 -92 L-5 -37Z','#a98354');food(c,0,-4,-38,.91,1,true);shape(c,'M2 -37 L98 -84 L99 -81 L3 -35Z','#c19b66');
 for(let j=0;j<4;j++)ellipse(c,-22+j*12,-21-j%2*5,1.7,2,'#b89d61')}
function paint(now){let [c,w,h]=stage($('pan'));c.translate(w/2,h*.42);let z=Math.min(w/235,h/124);c.scale(z,z);pot(c);slots.forEach((s,i)=>{if(!s.food)return;
 let x=slots.length===1?0:(i?38:-38),p=(now-s.born)/s.ms;food(c,s.food[0],x,-12,slots.length===1?.9:.73,p,visual);
 for(let n=0;n<12;n++){let a=n*2.4,t=(now/850+n*.37)%1;ellipse(c,x+Math.cos(a)*(22+t*6),-10+Math.sin(a)*10-t*2,1.2+t,.9,'rgba(255,245,201,'+(1-t)+')')}
 })}
function drawBag(){if(!bag.length){bag=[0,1,2,3];for(let i=3;i>0;i--){let j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()}
function newSlot(due){return {food:null,due,next:0}}
function fill(s,now){let id=drawBag();s.food=[id,...foods[id]];s.ms=s.food[2]*1000*(.95+Math.random()*.1);s.born=now;s.next=0}
function update(){
 if(!active)return;let now=performance.now(),elapsed=(now-startTime)/1000;
 if(elapsed>=60){finish();return}
 if(elapsed>=30&&slots.length===1){slots.push(newSlot(now+850));makeButtons()}
 slots.forEach((s,i)=>{if(!s.food&&now>=s.due)fill(s,now);let b=$('buttons').children[i],p=s.food?(now-s.born)/s.ms:0;
 let label=(slots.length===2?(i?'右　':'左　'):'')+(s.food?s.food[1]+'を上げる':'次のネタ…');
 if(visual&&s.food)label+='｜'+(p<.88?'白・揚げ途中':p<=1.13?'黄金・いま！':'茶・揚げすぎ');
 if(b.textContent!==label)b.textContent=label;b.disabled=!s.food});
 $('timer').textContent='残り '+Math.ceil(60-elapsed)+' 秒';if(now>feedbackUntil)$('feedback').textContent='';
 paint(now);raf=requestAnimationFrame(update)
}
function makeButtons(){$('buttons').replaceChildren();slots.forEach((s,i)=>{let b=document.createElement('button');b.className='lift';b.onclick=()=>lift(i);$('buttons').append(b)});
 $('hint').textContent=slots.length===1?'鍋をタップ、またはスペースキーで引き上げます。':'鍋の左右をタップ。← は左、→ は右、スペースは先に入れた方。'}
function lift(i){if(!active)return;let now=performance.now();if(now-startTime>=60000){finish();return}let s=slots[i];if(!s?.food)return;
 let p=(now-s.born)/s.ms,judge=p<.88?'早い':p<=1.13?'ちょうどいい':'揚げすぎ';
 let gain=0;if(judge==='ちょうどいい'){good++;streak++;gain=100+25*(streak-1);score+=gain;maxStreak=Math.max(maxStreak,streak);chime()}else streak=0;
 $('feedback').textContent=s.food[1]+'　'+judge+(gain?'　+'+gain:'');feedbackUntil=now+1500;
 s.food=null;s.due=now+650;$('points').textContent=score+' 点';$('chain').textContent=streak+' 連続'
}
$('pan').onclick=e=>lift(slots.length===2&&e.clientX>e.currentTarget.getBoundingClientRect().left+e.currentTarget.clientWidth/2?1:0);
document.addEventListener('keydown',e=>{if(!active||!['Space','ArrowLeft','ArrowRight'].includes(e.code))return;e.preventDefault();if(e.repeat)return;
 let i=e.code==='ArrowRight'?1:0;if(e.code==='Space')i=slots.findIndex(s=>s.food&&slots.every(o=>!o.food||s.born<=o.born));lift(i)});
async function begin(){if(active||opening)return;opening=true;try{await Promise.race([unlock(),new Promise((_,reject)=>setTimeout(()=>reject(),1000))])}catch{mode(true)}
 opening=false;active=true;$('intro').hidden=$('result').hidden=true;$('play').hidden=false;document.activeElement.blur();
 startTime=performance.now();slots=[newSlot(startTime)];bag=[];score=good=streak=maxStreak=0;feedbackUntil=0;$('points').textContent='0 点';$('chain').textContent='0 連続';makeButtons();update();audioTick();interval=setInterval(audioTick,30)}
function finish(){active=false;cancelAnimationFrame(raf);clearInterval(interval);$('play').hidden=true;$('result').hidden=false;
 $('rank').textContent=good>=10?'名人':good>=7?'揚げ師':good>=3?'板前':'見習い';$('count').textContent=good;$('summary').textContent=score+' 点　／　最長 '+maxStreak+' 連続';
 try{let key='otogoro.best.v1',best=Math.max(score,Number(localStorage.getItem(key))||0);localStorage.setItem(key,String(best));$('record').textContent='自己ベスト　'+best+' 点'}catch{$('record').textContent='この環境では自己ベストを保存できません'}$('again').focus()}
$('start').onclick=$('again').onclick=begin;$('back').onclick=()=>{$('result').hidden=true;$('intro').hidden=false;cover()};window.addEventListener('resize',cover);cover();
</script></html>
